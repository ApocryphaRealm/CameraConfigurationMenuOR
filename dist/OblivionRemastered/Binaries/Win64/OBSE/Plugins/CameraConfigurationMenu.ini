; CCM - Camera Configuration Menu (Oblivion Remastered). Every setting is also on the CCM page of the
; Apocrypha Menu Framework, which rewrites this file; edits made while the game is closed are read at start.

[General]
; 1 = CCM runs. 0 puts back the game's own camera values that CCM recorded.
bEnabled=1
; 0 = the game's camera, 1 = free camera (turn to face on block, cast and attack), 2 = free camera only with the weapon sheathed.
iCameraStyle=0
; Seconds the body keeps facing the camera after a block starts (free camera style).
fBlockTurnSeconds=0.20
; Seconds the body keeps facing the camera after a spell cast starts.
fSpellTurnSeconds=1.40
; Seconds the body keeps facing the camera after an attack or bow shot starts.
fAttackTurnSeconds=0.60
; 1 = keep facing the camera for as long as block or the attack button is held.
bFaceWhileHeld=0
; 1 = while Ultimate Combat is locked on to a target, no free camera: the body faces where the camera looks (the dodge directions need it).
bFaceWhileLockedOn=1
; How fast your character turns in third person with the free camera, in percent of the game's own turn speed (toward where you move and to face the camera). 100 = the game's.
fBodyTurnPercent=100.00
; 1 = the compass shows where the camera looks, not where the body faces (free camera only).
bCompassFollowsCamera=0
; 1 = the free camera also on horseback.
bFreeCameraOnHorse=0
; 1 = the game's own camera during dialogue.
bStandDownInDialogue=1
; 1 = the game's own camera while sitting or using furniture.
bStandDownSitting=1
; 1 = the game's idle camera that circles the player after a while without input; 0 = it never starts.
bVanityCamera=1

[Zoom]
; 1 = after loading a game the camera starts at the far third-person zoom instead of the close one.
bStartZoomedOut=0
; 1 = the two zoom distances below replace the game's own (not while aiming a bow or in a conversation).
bOwnDistances=0
; The close third-person zoom: how far behind the character the camera sits, in cm.
fCloseDistance=170.00
; The far third-person zoom, in cm.
fFarDistance=310.00

[Keys]
; Keyboard keys are DirectInput scan codes, 0 = none. 26 = [: move the camera to the other shoulder.
iShoulderSwapKey=26
; 27 = ]: switch between the two free camera styles.
iCycleStyleKey=27
; Turn CCM on and off.
iToggleKey=0
; Load the next saved preset.
iNextPresetKey=0
; Raise or lower the camera by the height offset.
iHeightOffsetKey=0
; Switch to the Custom framing group.
iCustomGroupKey=0
; Controller buttons are XInput masks, 0 = none. Every button already has a game action, so none ship bound.
iShoulderSwapButton=0
iCycleStyleButton=0
iToggleButton=0
iNextPresetButton=0
iHeightOffsetButton=0
iCustomGroupButton=0
; 56 = Left Alt: lock on to a target, and let go.
iLockOnKey=56
; 128 = the right stick click (R3): lock on to a target, and let go.
iLockOnButton=128
; While locked on, moves the aim point up a body part (Pelvis, Spine, Head). Default unbound.
iAimPointUpKey=0
; While locked on, moves the aim point down a body part (Head, Spine, Pelvis). Default unbound.
iAimPointDownKey=0
; A controller button for the aim point up. Default unbound - the right stick up does it ([LockOn] bStickAimPoint).
iAimPointUpButton=0
; A controller button for the aim point down. Default unbound - the right stick down does it.
iAimPointDownButton=0
; While locked on, switches to the previous target. Default Z.
iPrevTargetKey=44
; While locked on, switches to the next target. Default X.
iNextTargetKey=45
; A controller button for the previous target. Default unbound - the right stick left does it ([LockOn] bStickSwitch).
iPrevTargetButton=0
; A controller button for the next target. Default unbound - the right stick right does it.
iNextTargetButton=0

[LockOn]
; 1 = the lock key locks the camera on to a person or creature ahead of you. Ultimate Combat's own lock-on, when switched on in its settings, takes over instead.
bEnabled=1
; How far away a target can be locked, in game units (100 units make 1 metre). Default 3000. A lock lets go past this plus a tenth.
fRange=3000.00
; How far from the centre of the screen Lock-On looks for a target, in degrees. Default 40.
fAngle=40.00
; How far to the side a target switch looks for the next target, in degrees. Default 55.
fSwitchAngle=55.00
; How quickly the camera turns to follow a locked target. Higher is snappier. Default 0.75.
fTrackingSpeed=0.75
; Shortest time between two target switches, in seconds. Default 0.20.
fSwitchDelay=0.20
; 1 = only a target in sight is locked or switched to, and a lock lets go when the target stays out of sight.
bLineOfSight=1
; Sheathing your weapon releases the lock. Default on.
bReleaseWhenSheathing=1
; Lock-On only works while your weapon is drawn. Default off.
bRequireWeaponDrawn=0
; 1 = a sound when a lock starts, ends or switches.
bPlaySound=1
; 1 = flick the right stick left or right to move the lock to the next target that side.
bStickSwitch=1
; 1 = the target's name is drawn over it while locked.
bShowMarker=1
; The body part the camera aims at when a lock starts: 1 = Head, 2 = Spine, 3 = Pelvis. Default Spine.
iStartAimPoint=2
; 1 = with a bow the lock stays on the Head: the aim point up / down does not move it to the chest or pelvis. Melee and other weapons keep moving it.
bBowStaysOnHead=0
; 1 = with a bow the lock aims at the Head, with a melee weapon at the Spine (the chest); anything else uses the starting aim point. A body part you choose holds until the next lock or weapon change.
bAimPointByWeapon=1
; 1 = while locked on, the right stick up or down moves the aim point a body part.
bStickAimPoint=1

[Framing.Standing]
; Centimetres added to the game's sideways camera offset: + moves the camera further right of your character (it mirrors with the shoulder swap). 0 = the game's. Standing is also used by every context below whose bOwn is 0.
fSide=0.00
; Centimetres added to the camera's height.
fHeight=0.00
; Centimetres added to the camera's distance behind your character.
fDistance=0.00

[Framing.Moving]
; Walking or running. 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00

[Framing.Sprinting]
; Sprinting. 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00

[Framing.Sneaking]
; Sneaking (above sprinting, a drawn weapon and moving). 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00

[Framing.WeaponDrawn]
; A weapon other than a bow, or fists, out - when not sneaking or sprinting. 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00

[Framing.Bow]
; A bow held but not drawn - above sneaking, sprinting and moving (Aiming a bow is its own context). 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00

[Framing.Swimming]
; Swimming. 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00

[Framing.BowAiming]
; The bow drawn (aiming) - above holding a bow. 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00
; Degrees added to the aiming view's field of view: below 0 zooms in further, above 0 less.
fFieldOfView=0.00

[Framing.Horseback]
; On horseback. 1 = its own position below; 0 = Standing's.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00

[Framing.Conversation]
; 1 = the game's own conversation view, which is first person, with nothing added; 0 = the position below moves it.
bFirstPerson=0
; 1 = with first person in conversations, the offsets below are not added, so you look straight at the person you talk to.
bFirstPersonNoOffset=1
; 1 = in third person the camera stays aimed at the person you are talking to, whatever offset is added.
bLockOnSpeaker=0
; In a conversation - above every other context. 1 = the position below moves the game's conversation camera; 0 = the game's own.
bOwn=0
fSide=0.00
fHeight=0.00
fDistance=0.00
; Degrees added to the conversation view's field of view.
fFieldOfView=0.00

[Smoothing]
; 1 = a new camera position (a setting, a change of context, the shoulder swap) slides in instead of cutting.
bEaseOffsets=1
; The slide's curve: 0 linear; 1-3 quadratic, 4-6 cubic, 7-9 quartic, 10-12 quintic, 13-15 sine, 16-18 circular, 19-21 exponential (each in, out, in-out).
iOffsetEasing=15
; Seconds the slide takes.
fOffsetSeconds=0.50
; How tightly the camera follows your character's movement: higher is tighter, 0 = no smoothing. -1 = the game's.
fFollowSpeed=-1.00
; The furthest the camera may trail behind, in centimetres. 0 = no limit, -1 = the game's.
fMaxLagDistance=-1.00
; How tightly the camera follows looking up and down: higher is tighter, 0 = no smoothing. -1 = the game's.
fRotationSpeedPitch=-1.00
; How tightly the camera follows turning left and right. -1 = the game's.
fRotationSpeedYaw=-1.00
; Screen shake while sprinting: 1 = the game's shake, 0 = a steady camera.
bSprintShake=1
; Seconds the game takes to blend between its camera states (walking, sprinting, weapon drawn...). -1 = the game's.
fStateBlendSeconds=-1.00

[Selection]
; 1 = use what you are roughly looking at: anything within reach and angle, closest to the aim first. The crosshair's own target always wins.
bEnabled=0
; 1 = in third person.
bThirdPerson=1
; 1 = also in first person (the game's precise aim otherwise).
bFirstPerson=0
; 1 = the name of what Activate will use is drawn where it stands.
bShowMarker=1
; How far from your character, in game units (about 70 to a metre).
fRange=300.00
; How far to either side of where the camera looks, in degrees.
fMaxAngle=35.00
; 1 = a log line whenever the game's pick or this choice changes (for testing; fills the log).
bLogTargets=0

[Crosshair]
; 0 = the game's crosshair, 1 = contextual (shown only when it means something, below), 2 = always hidden.
iMode=0
; Contextual: shown while a bow is drawn or a spell is being cast.
bWhenAiming=1
; Contextual: shown while there is something to activate.
bWhenTarget=1
; Contextual: shown while a weapon is drawn.
bWhenWeaponDrawn=0
; Contextual: always shown in first person.
bInFirstPerson=1
; Seconds the crosshair takes to fade in or out.
fFadeSeconds=0.15

[Presets]
; The preset loaded last: 1-6 = your slots, -1 = Vanilla (the game's camera, as shipped), -2 = Player Camera, -3 = Player Camera Alt, -4 = ApocryphaRealm, 0 = none.
iActive=-1

[Log]
; 0 trace, 1 debug, 2 info, 3 warnings, 4 errors, 5 critical, 6 off. Use 1 when reporting a problem.
uLogLevel=2
